<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Pranav Bhawsar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--surface:#14161c;--border:#242833;--text:#e8ebf0;--dim:#a2aab8;--accent:#5ee9b5;--glow:rgba(94,233,181,.13)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
 font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center}
.b{max-width:460px}
.code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:clamp(56px,15vw,96px);line-height:1;
 background:linear-gradient(96deg,var(--accent),#7aa2f7);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 10px}
h1{font-size:clamp(20px,4vw,26px);margin:0 0 12px;letter-spacing:-.6px}
p{color:var(--dim);margin:0 0 26px;font-size:15.5px}
a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#04140e;text-decoration:none;
 padding:11px 20px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:0 4px 18px var(--glow);transition:transform .18s}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="b">
  <p class="code">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be out of date, or the page moved. Everything else is still on the home page.</p>
  <a href="/">← Back to portfolio</a>
</div>
</body>
</html>
